name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check conventional commit messages
        env:
          BASE: ${{ github.base_ref }}
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|ci|style|perf|build)(\([a-z0-9-]+\))?!?: .+'
          bad=0
          for sha in $(git rev-list --no-merges "origin/$BASE..HEAD"); do
            msg=$(git log -1 --format=%s "$sha")
            if ! echo "$msg" | grep -Eq "$pattern"; then
              echo "::error::Bad commit message in $sha: $msg"
              bad=1
            fi
          done
          exit $bad

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
      - name: Build project (skipping test execution during development)
        run: ./mvnw -B clean package -DskipTests
        continue-on-error: true
      - name: Build Docker image
        run: docker build -t rideease:ci .
        continue-on-error: true

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.RENDER_DEPLOY_HOOK_URL != ''
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        continue-on-error: true
