services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideease}
      POSTGRES_USER: ${DB_USER:-rideease}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rideease} -d ${POSTGRES_DB:-rideease}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rideease}
      DB_USER: ${DB_USER:-rideease}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rideease.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "8080:8080"

volumes:
  pgdata:
