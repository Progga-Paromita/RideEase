server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rideease}
    username: ${DB_USER:rideease}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

fare:
  base-fare: 50
  per-km: 20
  commission-percent: 20

app:
  admin-email: ${ADMIN_EMAIL:admin@rideease.com}
  admin-password: ${ADMIN_PASSWORD:Admin@123}

management:
  endpoints:
    web:
      exposure:
        include: health
